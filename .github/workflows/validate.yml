name: Validate

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.14 --group build
      - run: uv run --locked --python 3.14 --group build ruff check src tests tools packages/flet_background_audio/src/flet_background_audio
      - run: uv run --locked --python 3.14 --group build ruff format --check src tests tools packages/flet_background_audio/src/flet_background_audio
      - run: uv run --locked --python 3.14 --group build ty check src tests tools

  tests-linux:
    name: Tests (ubuntu-latest, Python 3.14)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.14
      - name: Unit tests
        run: uv run --locked --python 3.14 python -m unittest discover -s tests/unit -t . -v
      - name: Integration tests (offline)
        run: uv run --locked --python 3.14 python -m unittest discover -s tests/integration -t . -v
      - name: UI tests (headless)
        run: uv run --locked --python 3.14 python -m unittest discover -s tests/ui -t . -v

  tests-windows:
    name: Tests (windows-latest, Python 3.14)
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.14
      - name: Unit tests
        run: uv run --locked --python 3.14 python -m unittest discover -s tests/unit -t . -v
      - name: Integration tests (offline)
        run: uv run --locked --python 3.14 python -m unittest discover -s tests/integration -t . -v
      - name: UI tests (headless)
        run: uv run --locked --python 3.14 python -m unittest discover -s tests/ui -t . -v

  build-contracts:
    name: Packaging contracts and compiled UI smoke tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.14 --group build
      - run: uv run --locked --python 3.14 --group build python -m unittest discover -s tests/packaging -t . -v
