name: Validate

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  worker:
    name: yt-dlp worker (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.14
      - run: uv run --locked ruff check src tests
      - run: uv run --locked ruff format --check src tests
      - run: uv run --locked pytest -q

  tools:
    name: Build tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.14
      - run: uv run --locked ruff check tools
      - run: uv run --locked ruff format --check tools
      - run: uv run --locked pytest -q
      - run: uv run --locked python tools/release_version.py

  flutter:
    name: Flutter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux audio libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev
      - name: Audio plugin
        working-directory: packages/melody_audio
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: App
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
