name: Application builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FLUTTER_VERSION: "3.47.7"
  # Authenticates the media tools' GitHub release lookups.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  preflight:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: python -m tools.build.version

  validate:
    needs: preflight
    uses: ./.github/workflows/validate.yml

  windows:
    needs: [preflight, validate]
    environment: production
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: uv sync --locked --python 3.14 --no-dev
      - name: Build Windows bundle
        run: uv run --locked melody-build windows --architecture x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: melody-windows-x86_64-${{ needs.preflight.outputs.version }}
          path: build/windows
          if-no-files-found: error

  linux:
    needs: [preflight, validate]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libgtk-3-dev libmpv-dev
      - run: uv sync --locked --python 3.14 --no-dev
      - name: Build Linux bundle
        run: uv run --locked melody-build linux --architecture x86_64
      - name: Archive with executable permissions
        run: tar -czf build/melody-linux-x86_64-${{ needs.preflight.outputs.version }}.tar.gz -C build/linux .
      - uses: actions/upload-artifact@v7
        with:
          name: melody-linux-x86_64-${{ needs.preflight.outputs.version }}
          path: build/melody-linux-x86_64-${{ needs.preflight.outputs.version }}.tar.gz
          if-no-files-found: error

  macos:
    needs: [preflight, validate]
    environment: production
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.architecture }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: uv sync --locked --python 3.14 --no-dev
      - name: Build macOS bundle
        run: uv run --locked melody-build macos --architecture ${{ matrix.architecture }}
      - name: Archive with permissions and symlinks
        run: tar -czf build/melody-macos-${{ matrix.architecture }}-${{ needs.preflight.outputs.version }}.tar.gz -C build/macos .
      - uses: actions/upload-artifact@v7
        with:
          name: melody-macos-${{ matrix.architecture }}-${{ needs.preflight.outputs.version }}
          path: build/melody-macos-${{ matrix.architecture }}-${{ needs.preflight.outputs.version }}.tar.gz
          if-no-files-found: error

  android:
    needs: [preflight, validate]
    environment: production
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [apk, aab]
    env:
      ANDROID_KEY_STORE_BASE64: ${{ secrets.ANDROID_KEY_STORE_BASE64 }}
      ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Require production signing secrets
        run: |
          for name in ANDROID_KEY_STORE_BASE64 ANDROID_KEY_STORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "Missing required production secret: ${name}" >&2
              exit 1
            fi
          done
      # The Android SDK, NDK, Flutter and Gradle caches outgrow the runner's
      # free disk; drop preinstalled toolchains this job never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: uv sync --locked --python 3.14 --no-dev
      - name: Build Android ${{ matrix.target }}
        run: uv run --locked melody-build ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: melody-android-${{ matrix.target }}-${{ needs.preflight.outputs.version }}
          path: build/${{ matrix.target }}
          if-no-files-found: error
