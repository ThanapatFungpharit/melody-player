[project]
name = "flet-background-audio"
version = "0.7.0"
description = "Melody's Flet audio player and system media controls"
requires-python = ">=3.10"
dependencies = [
    "flet==0.86.5",
]

[tool.setuptools.package-data]
"flutter.flet_background_audio" = [
    "lib/**",
    "android/src/**",
    "android/build.gradle",
    "android/settings.gradle",
    "pubspec.yaml",
    "pubspec.lock",
]

[tool.setuptools.exclude-package-data]
"flutter.flet_background_audio" = ["build/**", ".dart_tool/**", "test/**"]

[tool.setuptools]
license-files = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
