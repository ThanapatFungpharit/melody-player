name: flet_background_audio
description: Melody audio player and system media-session bridge
version: 0.7.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  audio_session: 0.2.4
  flet: 0.86.5
  flutter:
    sdk: flutter
  flutter_media_session: 3.0.3
  just_audio: 0.10.6
  just_audio_media_kit: 2.1.0
  media_kit_libs_linux: 1.2.1
  media_kit_libs_windows_audio: 1.0.9

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  just_audio_platform_interface: 4.6.0

flutter:
  plugin:
    platforms:
      android:
        package: com.melodyplayer.flet_background_audio
        pluginClass: FletBackgroundAudioPlugin
