[project]
name = "melody-worker"
version = "1.0.0"
description = "Embedded Python worker (ytmusicapi and yt-dlp) for the Melody Flutter application"
requires-python = ">=3.14"
dependencies = [
    # The package updater verifies PyPI's TLS certificates with certifi's CA
    # bundle; embedded interpreters have no usable system CA paths.
    "certifi>=2024.2.2",
    # yt-dlp embeds cover art in Opus, Ogg Vorbis, and FLAC through mutagen.
    "mutagen==1.48.1",
    "packaging>=24.0",
    "yt-dlp==2026.8.19",
    "ytmusicapi==1.12.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.3",
    "ty>=0.0.84",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# melody_worker is first-party wherever ruff runs from.
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
